<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>botylazi · Přihlášení do administrace</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="lock-body">
    <main class="lock-card">
      <h1>🔒 Administrace</h1>
      <p class="muted">Zadejte heslo administrátora pro správu bot.</p>
      <form method="POST" action="/admin/login">
        <input
          type="password"
          name="password"
          placeholder="Heslo administrátora"
          autofocus
          required
        />
        <button type="submit">Přihlásit se</button>
      </form>
      <p id="err" class="error" hidden>Špatné heslo — zkuste to znovu.</p>
      <p class="muted small"><a href="/login">← Zpět do galerie</a></p>
    </main>
    <footer class="site-footer">
      developed by <a href="mailto:micash@seznam.cz">mica5h</a>
    </footer>
    <script>
      if (new URLSearchParams(location.search).has("error"))
        document.getElementById("err").hidden = false;
    </script>
  </body>
</html>
